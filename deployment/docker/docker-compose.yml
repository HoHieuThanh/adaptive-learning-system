services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: adaptive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adaptive_learning_db}
      POSTGRES_USER: ${POSTGRES_USER:-adaptive_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adaptive_password_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adaptive_user} -d ${POSTGRES_DB:-adaptive_learning_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - adaptive_net

  # ----------------------------------------------------------------------------
  # 2. ML MICROSERVICE: FastAPI + Scikit-learn + XGBoost
  # ----------------------------------------------------------------------------
  ml-service:
    build:
      context: ../../ml-service
      dockerfile: Dockerfile
    container_name: adaptive-ml-service
    restart: unless-stopped
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - adaptive_net

  # ----------------------------------------------------------------------------
  # 3. EXPERIMENT TRACKING: MLflow Tracking Server
  # ----------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: adaptive-mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://0.0.0.0:5000
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    networks:
      - adaptive_net

  # ----------------------------------------------------------------------------
  # 4. CORE BACKEND: Spring Boot 3 (Java 21)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: adaptive-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-adaptive_learning_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-adaptive_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-adaptive_password_dev}
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - adaptive_net

  # ----------------------------------------------------------------------------
  # 5. FRONTEND: React 18 + Vite (Served by Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080/api
    container_name: adaptive-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - adaptive_net

volumes:
  postgres_data:
    name: adaptive_postgres_data
  mlflow_data:
    name: adaptive_mlflow_data

networks:
  adaptive_net:
    name: adaptive_network
    driver: bridge
