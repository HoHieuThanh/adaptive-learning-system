# ==============================================================================
# ML SERVICE: DEPLOYMENT VÀ SERVICE (FASTAPI + SCIKIT-LEARN + XGBOOST)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service-deployment
  labels:
    app: ml-service
    app.kubernetes.io/component: ml-engine
    app.kubernetes.io/part-of: adaptive-learning-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
      - name: ml-service
        image: adaptive-learning-system-ml-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-ml
          containerPort: 8000
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: adaptive-config
              key: ML_PORT
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "800m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  labels:
    app: ml-service
spec:
  type: ClusterIP
  selector:
    app: ml-service
  ports:
  - name: http
    port: 8000
    targetPort: 8000
