name: Build and Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag version (e.g. v1.0.0, latest)'
        required: true
        default: 'latest'
      push:
        description: 'Push to GitHub Container Registry (ghcr.io)?'
        type: boolean
        required: true
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Publish Containers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/adaptive-frontend
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/adaptive-backend
          - name: ml-service
            context: ./ml-service
            dockerfile: ./ml-service/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/adaptive-ml-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'latest' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.push == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event.inputs.push == 'true' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
