server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: adaptive-learning-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adaptive_learning_db}
    username: ${SPRING_DATASOURCE_USERNAME:adaptive_user}
    password: ${SPRING_DATASOURCE_PASSWORD:adaptive_password_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ML Service Integration endpoint
ml-service:
  url: ${ML_SERVICE_URL:http://localhost:8000}

# Actuator monitoring endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:adaptive_learning_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

